<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Perro o Gato?</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script type="text/javascript">
<style>
  :root {
    --bg-1: #FDF4E7;
    --bg-2: #F4E3FF;
    --surface: rgba(255,255,255,0.72);
    --surface-solid: #FFFFFF;
    --ink: #241C2E;
    --ink-soft: #6C6178;
    --dog: #FF6B35;
    --dog-2: #FFB238;
    --cat: #6C5CE7;
    --cat-2: #33C6C0;
    --border: rgba(36,28,46,0.10);
    --shadow: 0 20px 50px -20px rgba(108,92,231,0.35);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #1A1424; --bg-2: #241832;
      --surface: rgba(38,28,52,0.72); --surface-solid: #241832;
      --ink: #F3ECFB; --ink-soft: #B4A6C6;
      --border: rgba(255,255,255,0.10);
      --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg-1: #1A1424; --bg-2: #241832;
    --surface: rgba(38,28,52,0.72); --surface-solid: #241832;
    --ink: #F3ECFB; --ink-soft: #B4A6C6;
    --border: rgba(255,255,255,0.10);
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 12% 8%, var(--bg-2), transparent 45%),
                radial-gradient(circle at 90% 15%, #FFE3C2, transparent 40%),
                var(--bg-1);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body {
      background: radial-gradient(circle at 12% 8%, var(--bg-2), transparent 45%),
                  radial-gradient(circle at 90% 15%, #3A2540, transparent 40%),
                  var(--bg-1);
    }
  }
  .blob {
    position: fixed; border-radius: 50%; filter: blur(60px); z-index: 0; opacity: .5; pointer-events: none;
  }
  .blob-1 { width: 320px; height: 320px; background: var(--dog-2); top: -80px; right: -80px; }
  .blob-2 { width: 260px; height: 260px; background: var(--cat); bottom: -60px; left: -60px; }

  .wrap { position: relative; z-index: 1; }

  .hero-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 800;
    font-size: clamp(2.1rem, 6vw, 3.2rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .hero-title .grad {
    background: linear-gradient(100deg, var(--dog) 0%, var(--dog-2) 40%, var(--cat) 70%, var(--cat-2) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: var(--ink-soft); font-size: 1.05rem; }

  .card-panel {
    background: var(--surface);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow);
  }

  .mode-tabs { display: inline-flex; background: var(--border); border-radius: 999px; padding: 4px; gap: 4px; }
  .mode-tab {
    border: none; background: transparent; color: var(--ink-soft); font-weight: 600;
    padding: .5rem 1.1rem; border-radius: 999px; font-size: .9rem; transition: all .2s ease;
  }
  .mode-tab.active {
    background: linear-gradient(120deg, var(--dog), var(--cat));
    color: #fff;
    box-shadow: 0 6px 16px -6px rgba(108,92,231,0.5);
  }

  .dropzone {
    border: 2.5px dashed var(--border);
    border-radius: 22px;
    padding: 3rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s ease, transform .15s ease, background .2s ease;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--cat);
    transform: translateY(-3px) scale(1.01);
    background: rgba(108,92,231,0.06);
  }
  .dropzone-icon { font-size: 3rem; filter: saturate(1.3); }

  #cameraWrap { display: none; }
  #cameraVideo, #captureCanvas {
    width: 100%; border-radius: 20px; background: #000;
    max-height: 380px; object-fit: cover;
  }
  #captureCanvas { display: none; }

  #previewWrap { display: none; }
  #previewImg {
    max-height: 380px; width: 100%; object-fit: contain;
    border-radius: 20px; background: var(--surface-solid); border: 1px solid var(--border);
  }

  .btn-hero {
    background: linear-gradient(120deg, var(--dog), var(--dog-2));
    border: none; color: #fff; font-weight: 700;
    border-radius: 14px; padding: .75rem 1.6rem;
    box-shadow: 0 10px 24px -8px rgba(255,107,53,0.55);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-hero:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -8px rgba(255,107,53,0.65); color:#fff; }
  .btn-hero:disabled { opacity: .5; transform: none; box-shadow: none; }
  .btn-ghost {
    border: 1.5px solid var(--border); color: var(--ink); background: transparent;
    border-radius: 14px; font-weight: 600; padding: .75rem 1.4rem;
  }
  .btn-ghost:hover { background: var(--border); color: var(--ink); }

  #result { display: none; }
  .result-badge {
    width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.6rem; box-shadow: 0 12px 24px -10px rgba(0,0,0,0.25);
    animation: pop .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .label-pill {
    display: inline-block; padding: .35rem 1rem; border-radius: 999px;
    font-weight: 700; font-size: .95rem; color: #fff;
  }
  .confidence-bar { height: 12px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .confidence-fill { height: 100%; border-radius: 999px; transition: width .8s cubic-bezier(.22,1,.36,1); }

  .spinner-wrap { display: none; }
  .pulse-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: linear-gradient(120deg, var(--dog), var(--cat));
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .5; } }

  .muted-note { color: var(--ink-soft); font-size: .9rem; }
  #alertBox { display: none; border-radius: 14px; border: none; }
  #noAiNote { display: none; }
</style>
</head>
<body>
<div>Teachable Machine Image Model</div>
<button type="button" onclick="init()">Start</button>
<div id="webcam-container"></div>
<div id="label-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script type="text/javascript">
    // More API functions here:
    // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/image

    // the link to your model provided by Teachable Machine export panel
    const URL = "./my_model/";

    let model, webcam, labelContainer, maxPredictions;

    // Load the image model and setup the webcam
    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // load the model and metadata
        // Refer to tmImage.loadFromFiles() in the API to support files from a file picker
        // or files from your local hard drive
        // Note: the pose library adds "tmImage" object to your window (window.tmImage)
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Convenience function to setup a webcam
        const flip = true; // whether to flip the webcam
        webcam = new tmImage.Webcam(200, 200, flip); // width, height, flip
        await webcam.setup(); // request access to the webcam
        await webcam.play();
        window.requestAnimationFrame(loop);

        // append elements to the DOM
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) { // and class labels
            labelContainer.appendChild(document.createElement("div"));
        }
    }

    async function loop() {
        webcam.update(); // update the webcam frame
        await predict();
        window.requestAnimationFrame(loop);
    }

    // run the webcam image through the image model
    async function predict() {
        // predict can take in an image, video or canvas html element
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction =
                prediction[i].className + ": " + prediction[i].probability.toFixed(2);
            labelContainer.childNodes[i].innerHTML = classPrediction;
        }
    }
</script>

</body>
</html>
